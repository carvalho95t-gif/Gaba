<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F172A" />
  <title>Gaba — Painel do professor</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon-192.png" />
  <style>
    /* SEM PILHA: os mesmos tokens do style.css. O JavaScript desta pagina nao le nada daqui. */
    :root {
      --bg: #F8FAFC; --card: #ffffff; --text: #0F172A; --muted: #64748B;
      --line: #E2E8F0; --line-2: #CBD5E1; --grafite: #0F172A;
      --menta: #10B981; --menta-2: #34D399; --menta-fundo: #ECFDF5; --menta-linha: #A7F3D0;
      --primary: #047857; --danger: #B91C1C;
      --raio-s: 10px; --raio-m: 16px; --raio-l: 24px; --raio-p: 999px;
      --e2: 8px; --e3: 12px; --e4: 16px; --e5: 24px;
      --sombra-1: 0 1px 2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.05);
      --sombra-2: 0 4px 6px -2px rgba(15,23,42,.06), 0 12px 24px -6px rgba(15,23,42,.12);
      --sombra-menta: 0 0 0 4px rgba(16,185,129,.18);
      --curva: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    header {
      background: var(--grafite); color: #fff; padding: 16px 18px calc(16px + env(safe-area-inset-top));
      display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
      box-shadow: var(--sombra-2);
    }
    header strong { font-size: 1.15rem; font-weight: 800; letter-spacing: -.02em; }
    header strong span { color: var(--menta-2); font-weight: 800; }
    header a { color: var(--menta-2); text-decoration: none; font-weight: 700; border-radius: var(--raio-s); }
    header a:hover { text-decoration: underline; }
    :focus-visible { outline: 3px solid var(--menta); outline-offset: 2px; }
    main { padding: var(--e4); max-width: 1100px; margin: 0 auto; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--e3); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--raio-m); padding: var(--e5) var(--e4); text-align: center; box-shadow: var(--sombra-1); }
    .card h3 { margin: 0; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .card p { margin: 8px 0 0; font-size: 2rem; font-weight: 800; letter-spacing: -.03em; color: var(--primary); font-variant-numeric: tabular-nums; }
    .filters { display: grid; grid-template-columns: 1.2fr 1fr 1fr auto; gap: var(--e2); margin: var(--e5) 0 var(--e4); }
    input, select, button {
      padding: 11px 13px; min-height: 44px; border-radius: var(--raio-s); border: 1px solid var(--line-2);
      background: #fff; font: inherit; font-size: .95rem; color: var(--text);
      transition: border-color .14s, box-shadow .14s;
    }
    input:focus, select:focus { border-color: var(--menta); box-shadow: var(--sombra-menta); outline: none; }
    button { cursor: pointer; font-weight: 700; }
    button.primary {
      background: var(--menta); color: #04291F; border-color: transparent; border-radius: var(--raio-p);
      padding: 11px 20px; box-shadow: var(--sombra-1); transition: filter .14s var(--curva);
    }
    button.primary:hover { filter: brightness(.94); }
    table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: var(--raio-m); overflow: hidden; box-shadow: var(--sombra-1); }
    th, td { padding: 12px; border-bottom: 1px solid var(--line); text-align: left; font-size: 14px; }
    tr:last-child td { border-bottom: none; }
    th { background: #F8FAFC; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    td { font-variant-numeric: tabular-nums; }
    .ok { color: var(--primary); font-weight: 800; }
    .bad { color: var(--danger); font-weight: 800; }
    dialog { border: 1px solid var(--line); border-radius: var(--raio-l); width: min(420px, 92vw); padding: var(--e5); box-shadow: var(--sombra-2); }
    dialog::backdrop { background: rgba(15,23,42,.45); }
    dialog h3 { margin: 0 0 var(--e4); font-size: 1.05rem; font-weight: 800; letter-spacing: -.02em; }
    label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin: var(--e4) 0 4px; }
    input[type="text"], input[type="email"], input[type="password"] { width: 100%; }
    /* os campos do dialog nao declaram type: sem isto eles nao herdam a largura cheia */
    dialog input { width: 100%; }
    @media (max-width: 800px) {
      .cards, .filters { grid-template-columns: 1fr; }
      table { font-size: 12px; display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <strong>Gaba <span>Painel</span></strong>
      <div id="profName" style="opacity:.75;font-size:13px">Professor</div>
    </div>
    <nav>
      <a href="./index.html">Leitor OMR</a>
      &nbsp;·&nbsp;
      <a href="#" id="openCfg">Configurar</a>
    </nav>
  </header>
  <main>
    <section class="cards">
      <article class="card"><h3>Média</h3><p id="statMedia">–</p></article>
      <article class="card"><h3>Taxa de aprovação</h3><p id="statAprov">–</p></article>
      <article class="card"><h3>Total de provas</h3><p id="statTotal">0</p></article>
    </section>
    <section class="filters">
      <input id="fAluno" placeholder="Filtrar por aluno ou matrícula" />
      <input id="fTurma" placeholder="Turma" />
      <input id="fData" type="date" />
      <button class="primary" id="btnXlsx">Exportar Excel</button>
    </section>
    <table>
      <thead>
        <tr>
          <th>Aluno</th><th>Matrícula</th><th>Data</th><th>Acertos</th><th>Nota</th><th>Origem</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>

  <dialog id="cfg">
    <form method="dialog">
      <h3>Conexão Supabase</h3>
      <label>URL</label>
      <input id="cfgUrl" />
      <label>Chave anon</label>
      <input id="cfgKey" />
      <label>Nome</label>
      <input id="cfgNome" />
      <label>E-mail</label>
      <input id="cfgEmail" type="email" />
      <p style="display:flex;gap:8px;margin-top:14px">
        <button value="cancel">Fechar</button>
        <button id="cfgSave" class="primary" value="default">Salvar</button>
      </p>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="./js/supabaseClient.js"></script>
  <script src="./js/offlineSync.js"></script>
  <script>
    let allRows = [];

    const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
    const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ESC[c]);

    function mergeById(a, b) {
      const map = new Map();
      a.concat(b).forEach((row) => { if (row && row.id) map.set(row.id, row); });
      return Array.from(map.values()).sort((x, y) => String(y.created_at).localeCompare(String(x.created_at)));
    }

    async function loadData() {
      const local = await GabaSync.listResults();
      let remote = [];
      try {
        if (GabaDB.isConfigured() && navigator.onLine) remote = await GabaDB.fetchCorrecoes();
      } catch (e) { /* offline / schema */ }
      allRows = mergeById(local, remote);
      render();
    }

    function filtered() {
      const aluno = document.getElementById("fAluno").value.trim().toLowerCase();
      const turma = document.getElementById("fTurma").value.trim().toLowerCase();
      const data = document.getElementById("fData").value;
      return allRows.filter((row) => {
        const name = String(row.aluno_nome || "").toLowerCase();
        const mat = String(row.matricula || "").toLowerCase();
        const t = String((row.raw_payload && row.raw_payload.turma) || row.turma || "").toLowerCase();
        const d = String(row.created_at || "").slice(0, 10);
        if (aluno && !name.includes(aluno) && !mat.includes(aluno)) return false;
        if (turma && !t.includes(turma)) return false;
        if (data && d !== data) return false;
        return true;
      });
    }

    function render() {
      const rows = filtered();
      const tbody = document.getElementById("rows");
      tbody.innerHTML = rows.map((row) => {
        const nota = Number(row.nota || 0);
        const cls = nota >= 6 ? "ok" : "bad";
        return "<tr><td>" + esc(row.aluno_nome || "–") + "</td><td>" + esc(row.matricula || "–") +
          "</td><td>" + esc(String(row.created_at || "").replace("T", " ").slice(0, 16)) +
          "</td><td>" + esc(row.acertos || 0) + "/" + esc(row.total_questoes || 0) +
          "</td><td class='" + cls + "'>" + esc(nota.toFixed(2)) + "</td><td>" + esc(row.origem || "nuvem") + "</td></tr>";
      }).join("") || "<tr><td colspan='6'>Nenhuma correção ainda.</td></tr>";

      const notas = rows.map((r) => Number(r.nota || 0));
      const media = notas.length ? notas.reduce((a, b) => a + b, 0) / notas.length : 0;
      const aprov = notas.length ? (notas.filter((n) => n >= 6).length / notas.length) * 100 : 0;
      document.getElementById("statMedia").textContent = notas.length ? media.toFixed(2) : "–";
      document.getElementById("statAprov").textContent = notas.length ? aprov.toFixed(0) + "%" : "–";
      document.getElementById("statTotal").textContent = String(rows.length);
      const cfg = GabaDB.readConfig();
      document.getElementById("profName").textContent = cfg.professorNome || "Configure o professor";
    }

    ["fAluno", "fTurma", "fData"].forEach((id) => {
      document.getElementById(id).addEventListener("input", render);
    });

    document.getElementById("btnXlsx").onclick = () => {
      const rows = filtered();
      const resumo = rows.map((r) => ({
        Aluno: r.aluno_nome || "",
        Matricula: r.matricula || "",
        Data: String(r.created_at || "").slice(0, 10),
        Acertos: r.acertos || 0,
        Total: r.total_questoes || 0,
        Nota: r.nota || 0
      }));
      const maxQ = rows.reduce((m, r) => Math.max(m, (r.respostas || []).length), 0);
      const matriz = rows.map((r) => {
        const line = { Aluno: r.aluno_nome || "", Matricula: r.matricula || "" };
        const gabMatrix = (r.raw_payload && r.raw_payload.matrix) || [];
        for (let i = 0; i < maxQ; i++) {
          const mark = gabMatrix[i];
          line["Q" + (i + 1)] = mark == null ? ((r.respostas || [])[i] ? 0 : "") : mark;
        }
        return line;
      });
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(resumo), "Resumo");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(matriz), "Matriz Pedagogica");
      XLSX.writeFile(wb, "gaba-resultados.xlsx");
    };

    document.getElementById("openCfg").onclick = (e) => {
      e.preventDefault();
      const cfg = GabaDB.readConfig();
      document.getElementById("cfgUrl").value = cfg.url;
      document.getElementById("cfgKey").value = cfg.key;
      document.getElementById("cfgNome").value = cfg.professorNome;
      document.getElementById("cfg").showModal();
    };
    document.getElementById("cfgSave").onclick = async (ev) => {
      ev.preventDefault();
      GabaDB.saveConfig(document.getElementById("cfgUrl").value.trim(), document.getElementById("cfgKey").value.trim());
      const nome = document.getElementById("cfgNome").value.trim();
      const email = document.getElementById("cfgEmail").value.trim();
      try {
        if (nome && email && GabaDB.isConfigured()) await GabaDB.upsertProfessor(nome, email);
        else if (nome) GabaDB.setProfessor(GabaDB.readConfig().professorId, nome);
      } catch (err) { /* keep local */ }
      document.getElementById("cfg").close();
      loadData();
    };

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
    loadData();
    window.addEventListener("online", loadData);
  </script>
</body>
</html>
